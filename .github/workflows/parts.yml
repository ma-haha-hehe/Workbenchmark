# SPDX-License-Identifier: Apache-2.0
name: Part resources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'mujoco==3.11.0' 'PyYAML==6.0.3'
      - run: python parts/validate.py
